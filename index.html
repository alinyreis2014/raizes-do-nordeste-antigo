<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Rede Raízes do Nordeste — peça pelo app, totem ou web, acompanhe seu pedido e acumule pontos." />
  <meta name="theme-color" content="#B5482A" />
  <title>Raízes do Nordeste — Peça online</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/styles.css" />
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <header class="topbar" role="banner">
    <div class="container topbar__inner">
      <a href="#/" class="brand" aria-label="Raízes do Nordeste — início">
        <img src="assets/favicon.svg" alt="" width="32" height="32" />
        <span class="brand__name">Raízes <small>do Nordeste</small></span>
      </a>
      <button class="unit-chip" id="unitChip" data-action="choose-unit" aria-label="Trocar unidade">
        <span aria-hidden="true">📍</span> <span id="unitChipLabel">Escolha a unidade</span>
      </button>
      <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1" aria-live="polite"></main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__credit">
        <p>© 2026 Rede Raízes do Nordeste — projeto acadêmico, dados fictícios.</p>
        <p>Desenvolvido por <strong>Aliny Reis Ramos</strong> — RU 5071671 — estudante de CST em Análise e Desenvolvimento de Sistemas (UNINTER).</p>
      </div>
      <nav aria-label="Links institucionais">
        <a href="#/privacidade">Política de privacidade</a>
        <button class="linklike" data-action="open-consent">Preferências de cookies</button>
        <a href="#/equipe">Equipe (cozinha/atendimento)</a>
        <a href="#/admin">Gerência</a>
        <button class="linklike" data-action="toggle-totem" id="totemToggle">Modo totem</button>
      </nav>
    </div>
  </footer>

  <div id="consentBanner" class="consent" hidden></div>
  <dialog id="modal" class="modal" aria-labelledby="modalTitle"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="container">Ative o JavaScript para fazer pedidos.</p></noscript>
</body>
</html>
